name: Build, Tag & Release (自动发布)

on:
  push:
    branches:
      - main

env:
  # 请替换为你的 Docker Hub 用户名/仓库名
  IMAGE_NAME: unsplash/bili-qq-bot
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install root Node dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer tests
        run: npx puppeteer browsers install chrome

      - name: Install Dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build Dashboard
        working-directory: dashboard
        run: npm run build

      - name: Run root unit tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Python Bilibili tests
        run: python -m pytest test/unit/bilibili

      - name: Lint Dashboard
        working-directory: dashboard
        run: npm run lint

  build-push:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from latest commit subject
        id: version
        shell: bash
        run: |
          commit_subject="$(git log -1 --pretty=%s)"
          echo "Detected commit subject: ${commit_subject}"
          if [[ "${commit_subject}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Latest commit subject must start with vX.Y.Z, current: ${commit_subject}"
            exit 1
          fi

      # 生成 Tag 逻辑
      # 版本由最新 commit subject 的 vX.Y.Z 提取为 X.Y.Z
      # 自动触发默认推 latest
      - name: Generate Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # 这里指定使用我们刚才创建的专用 Dockerfile
          file: ./Dockerfile.action
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure git tag exists
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          current_commit="$(git rev-parse HEAD)"

          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [[ "${tag_commit}" != "${current_commit}" ]]; then
              echo "::error::Tag ${tag} already exists at ${tag_commit}, current commit is ${current_commit}"
              exit 1
            fi
            echo "Tag ${tag} already exists on current commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"
          echo "Created and pushed tag ${tag}"

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare release notes
        shell: bash
        run: |
          tag="v${{ needs.build-push.outputs.version }}"
          setup_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag}/setup.sh"
          commit_subject="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"
          update_notes="${commit_subject}"
          if [ -n "${commit_body}" ]; then
            update_notes+=$'\n\n'"${commit_body}"
          fi
          cat > release-notes.md <<EOF
          ## 版本更新说明

          ${update_notes}

          ## 发布信息

          - 版本: **${tag}**
          - 触发提交: \`${{ github.sha }}\`
          - Docker 镜像: \`${{ env.IMAGE_NAME }}:${{ needs.build-push.outputs.version }}\`
          - 同步 latest 标签: **true**

          ## 简易 Docker 部署流程

          \`\`\`bash
          wget -O setup.sh ${setup_url}
          chmod +x setup.sh
          sudo ./setup.sh
          \`\`\`

          如需手动方式：

          \`\`\`bash
          git clone ${{ github.server_url }}/${{ github.repository }}.git
          cd SubX-bot
          docker compose up -d
          \`\`\`
          EOF

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build-push.outputs.version }}
          name: v${{ needs.build-push.outputs.version }}
          body_path: release-notes.md
          files: setup.sh
          make_latest: true
