name: Build, Tag & Release (自动发布)

on:
  push:
    branches:
      - main

env:
  # 请替换为你的 Docker Hub 用户名/仓库名
  IMAGE_NAME: unsplash/bili-qq-bot
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  # 按架构并行构建：amd64/arm64 各自使用原生 runner，避免 QEMU 模拟。
  # 每个架构以 digest 推送，再由 merge-manifest 合并多架构 manifest 并打 tag。
  build-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # 统一 Dockerfile：本地与 CI 共用，镜像源通过 build-arg 区分
          file: ./Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          # digest 推送 + zstd 压缩层（Docker 23+ 支持；旧客户端自动回退 gzip）
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,compression=zstd,compression-level=3,force-compression=true
          # 按架构隔离 gha 缓存，避免 amd64/arm64 层互相挤占
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 合并两个架构的 digest 为单一多架构 manifest，并打上版本与 latest 标签。
  # 版本解析与 git tag 只在这里做一次，避免矩阵任务竞争。
  merge-manifest:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version from latest commit subject
        id: version
        shell: bash
        run: |
          commit_subject="$(git log -1 --pretty=%s)"
          echo "Detected commit subject: ${commit_subject}"
          if [[ "${commit_subject}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)([[:space:]].*)?$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Latest commit subject must start with vX.Y.Z, current: ${commit_subject}"
            exit 1
          fi

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag "${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            --tag "${{ env.IMAGE_NAME }}:latest" \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Ensure git tag exists
        shell: bash
        run: |
          tag="v${{ steps.version.outputs.version }}"
          current_commit="$(git rev-parse HEAD)"

          if git show-ref --tags --verify --quiet "refs/tags/${tag}"; then
            tag_commit="$(git rev-list -n 1 "refs/tags/${tag}")"
            if [[ "${tag_commit}" != "${current_commit}" ]]; then
              echo "::error::Tag ${tag} already exists at ${tag_commit}, current commit is ${current_commit}"
              exit 1
            fi
            echo "Tag ${tag} already exists on current commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          # 镜像已推送成功；若提交包含 workflow 变更，GITHUB_TOKEN 无 workflows
          # 权限会导致 tag 推送被拒，此时降级为告警，由维护者手动补打 tag。
          if ! git push origin "${tag}"; then
            echo "::warning::Failed to push tag ${tag} (commit likely modifies workflow files; GITHUB_TOKEN lacks the workflows scope). Please create it manually: git tag -a ${tag} -m 'Release ${tag}' ${current_commit} && git push origin ${tag}"
            exit 0
          fi
          echo "Created and pushed tag ${tag}"

  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: merge-manifest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare release notes
        shell: bash
        run: |
          tag="v${{ needs.merge-manifest.outputs.version }}"
          setup_url="${{ github.server_url }}/${{ github.repository }}/releases/download/${tag}/setup.sh"
          commit_subject="$(git log -1 --pretty=%s)"
          commit_body="$(git log -1 --pretty=%b)"
          update_notes="${commit_subject}"
          if [ -n "${commit_body}" ]; then
            update_notes+=$'\n\n'"${commit_body}"
          fi
          cat > release-notes.md <<EOF
          ## 版本更新说明

          ${update_notes}

          ## 发布信息

          - 版本: **${tag}**
          - 触发提交: \`${{ github.sha }}\`
          - Docker 镜像: \`${{ env.IMAGE_NAME }}:${{ needs.merge-manifest.outputs.version }}\`
          - 同步 latest 标签: **true**

          ## 简易 Docker 部署流程

          \`\`\`bash
          wget -O setup.sh ${setup_url}
          chmod +x setup.sh
          sudo ./setup.sh
          \`\`\`

          如需手动方式：

          \`\`\`bash
          git clone ${{ github.server_url }}/${{ github.repository }}.git
          cd SubX-bot
          docker compose up -d
          \`\`\`
          EOF

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.merge-manifest.outputs.version }}
          name: v${{ needs.merge-manifest.outputs.version }}
          body_path: release-notes.md
          files: setup.sh
          make_latest: true
