# Default LLBot deployment template. Run setup.sh to select LLBot, NapCat or an existing OneBot service.
# Application settings remain in config/config.yaml; LLBot account settings live in llbot/data.
services:
  llbot:
    image: ${BILI_LLBOT_IMAGE:-linyuchen/llbot:latest}
    restart: always
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
      AUTO_LOGIN_QQ: ${BILI_BOT_QQ:-}
    ports:
      - "127.0.0.1:${BILI_LLBOT_WEBUI_HOST_PORT:-3080}:3080"
    volumes:
      - ./llbot/data:/app/llbot/data
      - ./onebot/media:/app/.config/QQ/tmp
    networks:
      - bot_network

  bili-qq-bot:
    image: ${BILI_BOT_IMAGE:-unsplash/bili-qq-bot:latest}
    pull_policy: if_not_present
    container_name: bili-qq-bot
    restart: always
    init: true
    stop_grace_period: 420s
    depends_on:
      llbot:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
    volumes:
      - type: bind
        source: ./config
        target: /app/config
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./logs
        target: /app/logs
      - type: bind
        source: ./fonts/custom
        target: /app/fonts/custom
      - type: bind
        source: ./onebot/media
        target: /app/.config/QQ/tmp
    ports:
      - "${BILI_DASHBOARD_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/live')
          .then(r=>{if(!r.ok)process.exit(1)})
          .catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge
